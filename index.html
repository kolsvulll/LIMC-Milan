<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站点资料库</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#05070a;--panel:#0e1114;--line:#232a30;--fg:#f1f4f5;--muted:#8a949b;--accent:#34d399;
  --sans:"Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:40px 16px 56px;display:flex;flex-direction:column;gap:24px}
h1{font-size:28px;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.st{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;color:var(--fg);text-decoration:none}
a.st:hover{border-color:var(--accent)}
a.st:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.code{font-family:var(--mono);font-size:12px;color:var(--accent)}
.name{font-size:20px;font-weight:700}
.what{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div><h1>站点资料库</h1><p class="sub">从 HuskyWeather 整理的机场站点数据。</p></div>
  <div class="list">
    <a class="st" href="limc.html"><span class="code">LIMC · Europe/Rome</span><span class="name">Milan 米兰</span><span class="what">升温画像（12 个月）</span></a>
    <a class="st" href="epwa.html"><span class="code">EPWA · Europe/Warsaw</span><span class="name">Warsaw 华沙</span><span class="what">全部标签：概览、模式、画像、模型差、METAR、PWS、TAF、降水、云图、聪明钱</span></a>
  </div>
</div>
</body>
</html>
